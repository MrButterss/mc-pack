name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check.py --ci

